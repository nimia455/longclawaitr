    <script>
      (function () {
        try {
          var root = document.documentElement;
          var savedTheme = localStorage.getItem('lc_theme');
          if (savedTheme === 'dark' || savedTheme === 'light') {
            root.dataset.theme = savedTheme;
          }
          var savedLang = localStorage.getItem('lc_lang');
          if (savedLang === 'tr' || savedLang === 'en') {
            root.lang = savedLang;
          } else if (navigator.language && navigator.language.toLowerCase().indexOf('tr') === 0) {
            root.lang = 'tr';
          }
          var savedFont = localStorage.getItem('lc_font');
          if (savedFont && savedFont !== 'auto') {
            root.dataset.font = savedFont;
          }
          delete root.dataset.accent;
          localStorage.removeItem('lc_accent_theme');
          localStorage.removeItem('lc_logo_variant');
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
